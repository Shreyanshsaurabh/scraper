name: Scrape Play Store Developers by Keyword

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Niche to search, e.g. "puzzle game" or "finance". Leave blank to use the built-in puzzle query list.'
        required: false
        default: ""
      regions:
        description: "Comma-separated Play Store country codes, e.g. in,us,gb"
        required: false
        default: "in"
      target_devs:
        description: "Number of qualifying developers to collect"
        required: false
        default: "10000"
      extra_args:
        description: "Optional extra flags, e.g. --backfill-phones  or  --inspect com.some.app  or  --max-searches 500"
        required: false
        default: ""
  # Uncomment to run automatically every day at 02:00 UTC
  # schedule:
  #   - cron: "0 2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's hard limit is 360 per job

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl tqdm google-play-scraper "pymongo[srv]"

      - name: Check MongoDB host (password is never printed)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python - <<'EOF'
          import os, sys
          uri = os.environ.get("MONGODB_URI", "")
          if not uri:
              sys.exit("MONGODB_URI secret is empty or not set")
          host = uri.split("@")[-1].split("/")[0].split("?")[0]
          print("Mongo host:", host)
          # Atlas hosts look like cluster0.ab1cd.mongodb.net (3+ parts before .net)
          if host.count(".") < 3:
              sys.exit(f"Host '{host}' is incomplete - copy the full string from Atlas > Connect > Drivers")
          EOF

      - name: Generate search terms from keyword
        if: ${{ github.event.inputs.keyword != '' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: |
          python generate_queries.py "${{ github.event.inputs.keyword }}" --out queries.json

      - name: Run scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: db3
          REGIONS: ${{ github.event.inputs.regions || 'in' }}
          QUERIES_FILE: queries.json
          TARGET_DEVS: ${{ github.event.inputs.target_devs || '10000' }}
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
        run: |
          python scraper.py --target-devs "$TARGET_DEVS" $EXTRA_ARGS

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-developers
          path: puzzle.xlsx
          if-no-files-found: ignore

      - name: Upload generated queries (for inspection)
        if: ${{ github.event.inputs.keyword != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-queries
          path: queries.json
          if-no-files-found: ignore
